<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando para Waslaa App...</title>
  <meta name="description" content="Redirecionamento para a plataforma Waslaa.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://app.waslaa.co/">
  <meta http-equiv="refresh" content="0; url=https://app.waslaa.co/">
  <script>
    (function () {
      var targetBase = "https://app.waslaa.co/";
      var queryAndHash = (window.location.search || "") + (window.location.hash || "");
      window.location.replace(targetBase + queryAndHash);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b18;
      --card-bg: rgba(16, 28, 58, 0.85);
      --border: rgba(158, 188, 255, 0.22);
      --cyan: #3ee0d4;
      --cyan-hover: #7ff0e8;
      --text: #e8eefc;
      --text-muted: #b4c0dc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      background-image:
        radial-gradient(1000px 500px at 10% -10%, rgba(62, 224, 212, 0.15), transparent 55%),
        radial-gradient(800px 400px at 90% 10%, rgba(124, 108, 240, 0.18), transparent 50%),
        linear-gradient(180deg, #060b18 0%, #0a1228 100%);
      color: var(--text);
      font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      text-align: center;
    }
    .redirect-card {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 60px rgba(2, 6, 18, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .logo {
      max-width: 190px;
      height: auto;
      margin-bottom: 2rem;
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 1.5rem auto;
      border: 3px solid rgba(62, 224, 212, 0.2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-family: "Outfit", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: var(--text);
    }
    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.75rem;
      font-family: "Outfit", sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #060b18;
      background: var(--cyan);
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(62, 224, 212, 0.35);
    }
    .btn:hover, .btn:focus-visible {
      background: var(--cyan-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(62, 224, 212, 0.5);
      outline: 2px solid var(--cyan-hover);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="redirect-card">
    <img src="../assets/logo-waslaa-uso-externo.png" alt="Waslaa" class="logo" width="377" height="124">
    <div class="spinner" role="status" aria-label="Carregando"></div>
    <h1>Redirecionando para Waslaa App</h1>
    <p>Você está sendo direcionado para o aplicativo da Waslaa. Se não for redirecionado automaticamente em alguns instantes, clique no botão abaixo:</p>
    <a id="redirect-link" href="https://app.waslaa.co/" class="btn">Acessar Waslaa App</a>
  </main>

  <script>
    (function () {
      var targetBase = "https://app.waslaa.co/";
      var queryAndHash = (window.location.search || "") + (window.location.hash || "");
      var fullUrl = targetBase + queryAndHash;
      var link = document.getElementById("redirect-link");
      if (link) {
        link.href = fullUrl;
      }
      window.location.replace(fullUrl);
    })();
  </script>
</body>
</html>
