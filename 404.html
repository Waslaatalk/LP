<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Waslaa</title>
  <meta name="description" content="Página não encontrada.">
  <script>
    (function () {
      var pathname = (window.location.pathname || "").replace(/\/+$/, "");
      if (pathname.endsWith("/teste")) {
        var queryAndHash = (window.location.search || "") + (window.location.hash || "");
        window.location.replace("https://app.waslaa.co/" + queryAndHash);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060b18;
      --card-bg: rgba(16, 28, 58, 0.85);
      --border: rgba(158, 188, 255, 0.22);
      --cyan: #3ee0d4;
      --cyan-hover: #7ff0e8;
      --text: #e8eefc;
      --text-muted: #b4c0dc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      background-image:
        radial-gradient(1000px 500px at 10% -10%, rgba(62, 224, 212, 0.15), transparent 55%),
        radial-gradient(800px 400px at 90% 10%, rgba(124, 108, 240, 0.18), transparent 50%),
        linear-gradient(180deg, #060b18 0%, #0a1228 100%);
      color: var(--text);
      font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 60px rgba(2, 6, 18, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .logo {
      max-width: 190px;
      height: auto;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      font-family: "Outfit", sans-serif;
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(62, 224, 212, 0.12);
      border: 1px solid rgba(62, 224, 212, 0.3);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: "Outfit", sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: var(--text);
    }
    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.75rem;
      font-family: "Outfit", sans-serif;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      color: #060b18;
      background: var(--cyan);
      box-shadow: 0 4px 18px rgba(62, 224, 212, 0.35);
    }
    .btn-primary:hover, .btn-primary:focus-visible {
      background: var(--cyan-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(62, 224, 212, 0.5);
    }
    .btn-secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover, .btn-secondary:focus-visible {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="card">
    <a href="./">
      <img src="assets/logo-waslaa-uso-externo.png" alt="Waslaa" class="logo" width="377" height="124">
    </a>
    <div><span class="badge">404</span></div>
    <h1>Página não encontrada</h1>
    <p>O conteúdo que você procura não foi encontrado ou foi movido.</p>
    <div class="actions">
      <a href="./" class="btn btn-primary">Voltar para o início</a>
      <a href="https://app.waslaa.co/" class="btn btn-secondary">Acessar Waslaa App</a>
    </div>
  </main>
</body>
</html>
